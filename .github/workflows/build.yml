name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Publish single-file exe
        run: dotnet publish MicMix/MicMix.csproj -c Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: MicMix-win-x64
          path: |
            publish/MicMix.exe
            MicMix-app/*.txt
